   - name: Send Slack Alert on Failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
               --data '{"text":"🚨 *Alert:* Vectorize ingestion script for `multireligionvalsystem` failed! <https://github me/'"${GITHUB_REPOSITORY}"'/actions/runs/'"${GITHUB_RUN_ID}"'|View Logs>"}' \
               $SLACK_WEBHOOK
 name: Automated Ecosystem Vector Ingestion

on:
    schedule:
        # Runs every Sunday at midnight UTC (0 0 * * 0)
        - cron: '0 0 * * 0'
    workflow_dispatch: # Allows manual triggers directly from the GitHub UI

jobs:
    run-ingestion:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
                uses: actions/checkout@v4

            - name: Set up Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: '20'
                    cache: 'npm'

            - name: Install dependencies
                run: npm ci || npm install

            - name: Execute Ecosystem Ingestion Script
                env:
                    INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
                run: node ingest-ecosystem.js